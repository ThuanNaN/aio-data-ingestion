# arXiv Daily Crawler Configuration

# List of categories to crawl
# Reference: https://arxiv.org/category_taxonomy
categories:
  - cs.LG   # Machine Learning
  - cs.CV   # Computer Vision

# Max papers per category
max_results_per_category: 50

# Output directory
output_dir: data

# Logs directory
log_dir: logs

# Days back to fetch papers (1 = today only, 3 = last 3 calendar days)
days_back: 1

# arXiv API settings
api:
  base_url: "http://export.arxiv.org/api/query"
  # Delay between category requests (arXiv recommends >= 3 seconds)
  request_delay: 5
  timeout: 60
  max_retries: 6
  retry_backoff: 15
